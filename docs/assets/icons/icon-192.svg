<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="primGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Glowing Aura -->
  <circle cx="96" cy="96" r="60" fill="none" stroke="url(#primGrad)" stroke-width="4" filter="url(#glow)" opacity="0.6" />

  <!-- Sound Waves (Left & Right) -->
  <path d="M46 76 C40 82, 40 110, 46 116" fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" />
  <path d="M58 84 C54 88, 54 104, 58 108" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

  <path d="M146 76 C152 82, 152 110, 146 116" fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" />
  <path d="M134 84 C138 88, 138 104, 134 108" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

  <!-- Center Microphone Icon -->
  <g transform="translate(96, 88) scale(2.6) translate(-12, -12)">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="url(#primGrad)" stroke="#ffffff" stroke-width="1.2" />
    <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="12" y1="19" x2="12" y2="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <line x1="8" y1="22" x2="16" y2="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
