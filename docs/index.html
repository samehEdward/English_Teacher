<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) real on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EchoSpeak — Deutsch für IT-Support und Labor</title>
    <meta name="description" content="Gesprächstraining für den Berufseinstieg im Krankenhaus: IT-Support und medizinisches Labor, auf Deutsch und Englisch, mit arabischen Erklärungen." />
    <meta name="theme-color" content="#EEF2EF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon-192-D1tLmBWc.svg" />
    
    <link rel="apple-touch-icon" href="./assets/icon-192-BkqLn7yT.png" />
    <script type="module" crossorigin src="./assets/index-iQR95rJC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CkeltNIj.css">
      <link rel="manifest" href="./manifest.json" />
  </head>
  <body data-mode="tabs">
    <div class="app">
      <header class="topbar">
        <span class="topbar__brand">EchoSpeak</span>
        <div class="lang-toggle" role="group" aria-label="Trainingssprache">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Einstellungen"></button>
      </header>

      <!-- The only scroll container. Views mount here. -->
      <main class="view" id="view"></main>

      <nav class="tabbar" id="tabbar" aria-label="Bereiche">
        <a href="#/" class="tabbar__tab" data-tab="practice"><span class="tabbar__icon" aria-hidden="true"></span><span class="tabbar__label"></span></a>
        <a href="#/words" class="tabbar__tab" data-tab="words"><span class="tabbar__icon" aria-hidden="true"></span><span class="tabbar__label"></span></a>
        <a href="#/quiz" class="tabbar__tab" data-tab="quiz"><span class="tabbar__icon" aria-hidden="true"></span><span class="tabbar__label"></span></a>
      </nav>
    </div>

    <!-- Session controls. The mic button mirrors the speech state machine. -->
    <div class="action-bar" id="actionBar" role="toolbar" aria-label="Antworten" hidden>
      <button type="button" class="bar-btn" data-slot="0" hidden></button>
      <button type="button" class="bar-btn" data-slot="1" hidden></button>
      <button type="button" class="fab-mic" id="fabMic" data-state="IDLE" aria-label="Sprechen">
        <svg class="fab-icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        <svg class="fab-icon-stop hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      </button>
      <button type="button" class="bar-btn" data-slot="2" hidden></button>
      <button type="button" class="bar-btn" data-slot="3" hidden></button>
    </div>

    <!-- Transient messages: mic state, permissions, missing voice data. -->
    <div class="status-strip" id="statusStrip" role="status" aria-live="polite">
      <span class="status-icon" id="statusIcon" aria-hidden="true"></span>
      <span class="status-text" id="statusText"></span>
      <button type="button" class="status-action hidden" id="statusAction"></button>
    </div>

    <div class="sheet" id="sheet"></div>

  </body>
</html>
